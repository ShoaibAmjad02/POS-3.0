{% extends 'admin/base_admin.html' %}
{% load static %}
{% block content %}
<div class="top-bar">
  <h2>{% if edit_user %}Edit{% else %}Create{% endif %} Super <span>Admin</span></h2>
  <a href="{% url 'users:super_admin_list' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back</a>
</div>

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="form-card">
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label>Full Name</label>
          <input type="text" name="name" class="form-control" value="{{ edit_user.name|default:'' }}" required>
        </div>
        <div class="mb-3">
          <label>Email Address</label>
          <input type="email" name="email" class="form-control" value="{{ edit_user.email|default:'' }}" required>
        </div>
        {% if not edit_user %}
        <div class="mb-3">
          <label>Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Confirm Password</label>
          <input type="password" name="confirm_password" class="form-control" required>
        </div>
        {% else %}
        <div class="mb-3">
          <label>New Password (leave blank to keep current)</label>
          <input type="password" name="password" class="form-control">
        </div>
        {% endif %}
        <button type="submit" class="btn btn-warning px-5 py-2">
          <i class="bi bi-{% if edit_user %}check-lg{% else %}person-plus{% endif %} me-2"></i>
          {% if edit_user %}Update Super Admin{% else %}Create Super Admin{% endif %}
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
