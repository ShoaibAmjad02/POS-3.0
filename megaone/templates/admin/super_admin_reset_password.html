{% extends 'admin/base_admin.html' %}
{% load static %}
{% block content %}
<div class="top-bar">
  <h2>Reset Password <span>{{ edit_user.name }}</span></h2>
  <a href="{% url 'users:super_admin_list' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back</a>
</div>

<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="form-card">
      <p class="text-muted mb-3">Resetting password for <strong>{{ edit_user.email }}</strong></p>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label>New Password</label>
          <input type="password" name="password" class="form-control" required minlength="6">
        </div>
        <div class="mb-3">
          <label>Confirm Password</label>
          <input type="password" name="confirm_password" class="form-control" required minlength="6">
        </div>
        <button type="submit" class="btn btn-warning px-5 py-2"><i class="bi bi-key me-2"></i>Reset Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
