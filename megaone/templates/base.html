{% load static i18n format_tags %}

<!DOCTYPE html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}" {% block html_attributes %}{% endblock html_attributes %}>

<head>
  <meta charset="utf-8"/>
  <meta http-equiv="x-ua-compatible" content="ie=edge"/>
  <title>{% block title %}{% endblock title %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description"
        content="{% block meta_description %}{{ company_name }} Management System{% endblock %}"/>
  <meta name="author" content="coderthemes"/>

  <link rel="icon" href="{% static 'vendor/img/favicon.ico' %}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  {% block css %}{% endblock css %}

</head>

<body {% block body_attributes %}{% endblock body_attributes %}>

{% block content %}{% endblock content %}

{% block modal %}{% endblock modal %}

<!-- Confirmation Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
<div class="modal-dialog modal-dialog-centered modal-sm">
<div class="modal-content" style="background:#1e293b;border:1px solid rgba(255,255,255,.08);border-radius:16px;color:#e2e8f0">
<div class="modal-body" style="padding:28px 24px 20px;text-align:center">
<i class="bi bi-exclamation-triangle" style="font-size:40px;color:#f59e0b;display:block;margin-bottom:12px"></i>
<p id="confirmMessage" style="font-size:15px;font-weight:500;margin:0;line-height:1.5;color:#e2e8f0"></p>
</div>
<div class="modal-footer" style="border:none;padding:0 24px 24px;justify-content:center;gap:12px">
<button type="button" class="btn btn-secondary" data-bs-dismiss="modal" style="min-width:100px;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;background:#64748b;border:none;color:#fff" id="confirmCancelBtn">Cancel</button>
<button type="button" class="btn btn-danger" style="min-width:100px;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;background:#dc2626;border:none;color:#fff" id="confirmOkBtn">OK</button>
</div>
</div></div></div>

{% block javascript %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock javascript %}

<audio id="clickSound" preload="auto">
    <source src="{% static 'audio/click.mp3' %}" type="audio/mpeg">
</audio>

<script>
(function() {
    var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    document.cookie = "user_timezone=" + encodeURIComponent(tz) + "; path=/; max-age=" + (365*24*60*60);
    fetch("{% url 'users:set_timezone' %}", {
        method: "POST",
        headers: {"Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token }}"},
        body: JSON.stringify({timezone: tz})
    });
})();
</script>

<script>
window.currencySymbol = '{{ currency_symbol|escapejs }}' || 'Rs ';

var confirmResolve = null;
function confirmAction(message) {
    return new Promise(function(resolve) {
        document.getElementById('confirmMessage').textContent = message;
        confirmResolve = resolve;
        var modal = new bootstrap.Modal(document.getElementById('confirmModal'), {backdrop: 'static', keyboard: false});
        modal.show();
    });
}

document.addEventListener('click', function(e) {
    if (e.target && e.target.id === 'confirmOkBtn') {
        var modal = bootstrap.Modal.getInstance(document.getElementById('confirmModal'));
        if (modal) modal.hide();
        if (confirmResolve) { confirmResolve(true); confirmResolve = null; }
    }
});

document.getElementById('confirmCancelBtn').addEventListener('click', function() {
    if (confirmResolve) { confirmResolve(false); confirmResolve = null; }
});

document.getElementById('confirmModal').addEventListener('hidden.bs.modal', function() {
    if (confirmResolve) { confirmResolve(false); confirmResolve = null; }
});

function performLogout() {
    window.location.href = '{% url "users:logout" %}';
}

function confirmSubmit(form, message) {
    confirmAction(message).then(function(r) {
        if (r) form.submit();
    });
}

function formatNumber(value, decimals) {
    if (value === null || value === undefined || value === '') return '0';
    if (typeof value === 'string') value = value.replace(/[^0-9.-]/g, '');
    value = parseFloat(value);
    if (isNaN(value)) return '0';
    decimals = (decimals !== undefined) ? decimals : 2;
    if (decimals < 0) decimals = 0;
    return value.toLocaleString('en-US', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
    });
}

function formatCurrency(value, decimals) {
    var sym = window.currencySymbol || 'Rs ';
    return sym + ' ' + formatNumber(value, decimals).trim();
}

function toTitleCase(str) {
    if (!str || typeof str !== 'string') return str;
    var exceptions = ['a', 'an', 'the', 'and', 'or', 'but', 'in', 'on', 'at', 'to', 'for', 'of', 'by', 'with'];
    return str.split(/\s+/).map(function(word, i) {
        if (!word) return word;
        if (i > 0 && exceptions.indexOf(word.toLowerCase()) !== -1) {
            return word.toLowerCase();
        }
        return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
    }).join(' ');
}

document.addEventListener('blur', function(e) {
    var el = e.target;
    if (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA') return;
    var type = (el.type || '').toLowerCase();
    if (type === 'email' || type === 'password' || type === 'url' || type === 'number' || type === 'tel' || type === 'search') return;
    var name = (el.name || el.id || '').toLowerCase().replace(/[_-]/g, '');
    var titleFields = ['name', 'title', 'companyname', 'contactperson', 'superusername', 'custname', 'kname', 'editname', 'fullname', 'supplier', 'city', 'shop', 'warehouse', 'brand', 'subcategory', 'expensetitle', 'employeename'];
    if (titleFields.some(function(f) { return name.indexOf(f) !== -1 || name === f; }) && !el.hasAttribute('data-no-title')) {
        el.value = toTitleCase(el.value);
    }
}, true);

document.body.addEventListener("click", function(){
    var s = document.getElementById("clickSound");
    if(s){ s.load(); }
}, {once:true});

document.addEventListener("click", function(event){
    var clickable = event.target.closest("button, a, .btn, input[type='button'], input[type='submit'], .card, .dropdown-item");
    if(!clickable) return;
    var clickSound = document.getElementById("clickSound");
    if(clickSound){
        clickSound.volume = 0.5;
        clickSound.currentTime = 0;
        clickSound.play().catch(function(error){
            console.log("Click sound blocked:", error);
        });
    }
});
</script>
</body>
</html>
