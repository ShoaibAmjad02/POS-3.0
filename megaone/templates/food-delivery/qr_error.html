{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Invalid QR Code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;text-align:center;padding:20px;}
        .error-box{max-width:500px;padding:40px;width:100%}
        .error-box h1{font-size:60px;color:#dc3545;}
        .error-box p{font-size:18px;color:#aaa;margin:20px 0;word-break:break-word}
        .btn{padding:12px 24px;border-radius:10px;font-size:16px;text-decoration:none;transition:.2s}
        @media(max-width:480px){.error-box{padding:24px 16px}.error-box h1{font-size:40px}.error-box p{font-size:15px}.btn{width:100%;display:block}}
    </style>
</head>
<body>
    <div class="error-box">
        <h1>Invalid QR</h1>
        <p>{{ error|default:"This QR code is invalid or expired." }}</p>
        <p>Please scan a valid store QR code.</p>
        <a href="/" class="btn btn-warning mt-3">Go Home</a>
    </div>
</body>
</html>
