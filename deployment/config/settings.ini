[Django]
settings_module = config.settings.production
wsgi_application = config.wsgi:application
static_root = %BASE_DIR%\staticfiles
media_root = %BASE_DIR%\megaone\media
locale_path = %BASE_DIR%\locale

[Server]
host = 127.0.0.1
port = 8000
workers = 4
threads = 4
url_scheme = http
timeout = 120

[Database]
engine = django.db.backends.mysql
name = electricstore
user = root
password = 123456
host = localhost
port = 3306
conn_max_age = 60

[Paths]
project_dir = %BASE_DIR%
venv_dir = %BASE_DIR%\deployment\runtime\venv
log_dir = %BASE_DIR%\deployment\logs
backup_dir = %BASE_DIR%\deployment\backups
static_dir = %BASE_DIR%\staticfiles
media_dir = %BASE_DIR%\megaone\media
temp_dir = %BASE_DIR%\deployment\temp

[Logging]
server_log = server.log
error_log = error.log
install_log = install.log
access_log = access.log
backup_log = backup.log
log_level = INFO
max_log_size_mb = 10
backup_count = 5

[Backup]
database_backup_dir = %BASE_DIR%\deployment\backups\database
media_backup_dir = %BASE_DIR%\deployment\backups\media
max_backups = 30
backup_format = zip
